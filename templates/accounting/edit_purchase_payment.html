{% extends "base.html" %}

{% block title %}Edit Payment Made - SUMAK ERP{% endblock %}

{% block page_title %}Edit Payment Made{% endblock %}

{% block content %}

<div style="background: white; padding: 24px; border-radius: 12px; border: 1px solid #e0ddd8; margin-bottom: 24px;">
    <strong>{{ payment.supplier_name }}</strong> — {{ payment.invoice_no or "On Account" }}
</div>

<form method="POST" action="/purchase-payments/edit/{{ payment.id }}">
    <div style="display: flex; flex-direction: column; gap: 4px;">
        <label>Payment Date</label>
        <input type="date" name="payment_date" value="{{ payment.payment_date }}" required>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
        <label>Amount Paid</label>
        <input type="number" step="0.01" name="amount" value="{{ payment.amount }}" required>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
        <label>Payment Mode</label>
        <select name="payment_mode">
            <option value="cash" {% if payment.payment_mode == "cash" %}selected{% endif %}>Cash</option>
            <option value="bank" {% if payment.payment_mode == "bank" %}selected{% endif %}>Bank Transfer</option>
            <option value="upi" {% if payment.payment_mode == "upi" %}selected{% endif %}>UPI</option>
            <option value="cheque" {% if payment.payment_mode == "cheque" %}selected{% endif %}>Cheque</option>
        </select>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
        <label>Reference No</label>
        <input type="text" name="reference_no" value="{{ payment.reference_no or '' }}">
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
        <label>Remarks</label>
        <input type="text" name="remarks" value="{{ payment.remarks or '' }}">
    </div>

    <button type="submit">Save Changes</button>
</form>

{% endblock %}
