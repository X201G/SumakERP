{% extends "base_manufacturing.html" %}

{% block title %}New Customer Order - SUMAK Manufacturing{% endblock %}

{% block page_title %}New Customer Order{% endblock %}

{% block content %}

<form method="POST" action="/manufacturing/orders/add">
    <div style="display: flex; flex-direction: column; gap: 4px;">
        <label>Date</label>
        <input type="date" name="order_date" required>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
        <label>Customer</label>
        <select name="customer_id" id="order_customer_select" required style="min-width: 240px;">
            <option value="">-- Select Customer --</option>
            {% for c in customers %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
        <label>Customer PO No (optional)</label>
        <input type="text" name="po_no" style="min-width: 200px;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; width: 100%;">
        <label>Remarks</label>
        <input type="text" name="remarks">
    </div>

    <div style="width: 100%;">
        <h3 style="margin: 16px 0 12px; color: #14213d;">Order Items</h3>
        <table>
            <thead>
                <tr>
                    <th>Tool</th>
                    <th>Quantity</th>
                    <th>Rate (₹, optional)</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="orderItemsBody">
                <tr>
                    <td>
                        <input type="text" class="order-tool-display" readonly placeholder="Click to select a tool..." onclick="openToolDrawer(this)" style="cursor: pointer; background: white; min-width: 260px;">
                        <input type="hidden" class="order-tool-id" name="tool_id[]">
                    </td>
                    <td><input type="number" name="quantity[]" min="1" style="width: 100px;"></td>
                    <td><input type="number" step="0.01" name="rate[]" style="width: 120px;"></td>
                    <td><button type="button" onclick="removeOrderRow(this)" style="background: #c1121f;">✕</button></td>
                </tr>
            </tbody>
        </table>
        <button type="button" onclick="addOrderRow()" style="background: #14213d; margin-top: 12px;">+ Add Row</button>
    </div>

    <div style="width: 100%; margin-top: 16px;">
        <button type="submit">Create Order</button>
    </div>
</form>

<div id="toolDrawerOverlay" onclick="closeToolDrawer()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9998;"></div>
<div id="toolDrawer" style="display: none; flex-direction: column; position: fixed; bottom: 0; left: 0; width: 100%; height: 65%; background: white; z-index: 9999; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.15);">
    <div style="padding: 20px; border-bottom: 1px solid #e0ddd8; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; gap: 12px; align-items: center;">
            <input type="text" id="toolDrawerSearch" placeholder="Search tools by item code, name or type..." autocomplete="off" oninput="filterToolDrawer()" style="flex: 1; padding: 12px 16px; border: 1.5px solid #e0ddd8; border-radius: 8px; font-size: 15px;">
            <button type="button" onclick="closeToolDrawer()" style="background: #14213d; color: white; border: none; border-radius: 8px; padding: 12px 20px; cursor: pointer; font-weight: 600;">✕ Close</button>
        </div>
        <label id="showAllToolsLabel" style="display: flex; align-items: center; gap: 8px; font-weight: normal; text-transform: none; font-size: 13px; background: none; padding: 0; cursor: pointer;">
            <input type="checkbox" id="showAllToolsToggle" onchange="filterToolDrawer()" style="width: auto;">
            <span id="showAllToolsText">Show all tools</span>
        </label>
    </div>
    <div style="overflow-y: auto; flex: 1; padding: 0 20px;">
        <table style="width: 100%;">
            <thead style="position: sticky; top: 0; background: white;">
                <tr>
                    <th>Item Code</th>
                    <th>Tool Name</th>
                    <th>Type</th>
                </tr>
            </thead>
            <tbody id="toolDrawerList"></tbody>
        </table>
    </div>
</div>

<script>
    const orderTools = [
        {% for t in tools %}
        {id: {{ t.id }}, code: {{ (t.item_code or '')|tojson }}, name: {{ t.tool_name|tojson }}, type: {{ t.tool_type|tojson }}, customerId: {{ t.customer_id|tojson }}},
        {% endfor %}
    ];

    let toolDrawerTargetRow = null;

    function openToolDrawer(displayInput) {
        toolDrawerTargetRow = displayInput.closest('tr');
        document.getElementById('toolDrawerOverlay').style.display = 'block';
        document.getElementById('toolDrawer').style.display = 'flex';
        document.getElementById('toolDrawerSearch').value = '';
        document.getElementById('showAllToolsToggle').checked = false;

        const customerSelect = document.getElementById('order_customer_select');
        const hasCustomer = !!customerSelect.value;
        const customerName = hasCustomer ? customerSelect.options[customerSelect.selectedIndex].text : '';
        document.getElementById('showAllToolsLabel').style.display = hasCustomer ? 'flex' : 'none';
        document.getElementById('showAllToolsText').textContent = 'Show all tools (not just ' + customerName + ')';

        document.getElementById('toolDrawerSearch').focus();
        filterToolDrawer();
    }

    function closeToolDrawer() {
        document.getElementById('toolDrawerOverlay').style.display = 'none';
        document.getElementById('toolDrawer').style.display = 'none';
    }

    function renderToolDrawer(list, filteredByCustomer) {
        const tbody = document.getElementById('toolDrawerList');
        tbody.innerHTML = '';
        if (list.length === 0) {
            const msg = filteredByCustomer ? 'No tools for this customer - try "Show all tools"' : 'No matching tools';
            tbody.innerHTML = '<tr><td colspan="3" style="padding: 20px; text-align: center; color: #999;">' + msg + '</td></tr>';
            return;
        }
        list.forEach(function(t) {
            const row = document.createElement('tr');
            row.style.cursor = 'pointer';
            row.onmouseover = function() { row.style.background = '#f5f3ef'; };
            row.onmouseout = function() { row.style.background = 'white'; };
            row.onclick = function() { pickTool(t); };
            row.innerHTML = '<td><strong>' + t.code + '</strong></td><td>' + t.name + '</td><td>' + t.type + '</td>';
            tbody.appendChild(row);
        });
    }

    function filterToolDrawer() {
        const q = document.getElementById('toolDrawerSearch').value.trim().toLowerCase();
        const showAll = document.getElementById('showAllToolsToggle').checked;
        const customerId = document.getElementById('order_customer_select').value;

        let list = orderTools;
        const filteringByCustomer = !showAll && !!customerId;
        if (filteringByCustomer) {
            list = list.filter(t => String(t.customerId) === String(customerId));
        }
        if (q) {
            list = list.filter(t => t.name.toLowerCase().includes(q) || t.type.toLowerCase().includes(q) || t.code.toLowerCase().includes(q));
        }
        renderToolDrawer(list, filteringByCustomer);
    }

    function pickTool(t) {
        if (!toolDrawerTargetRow) return;
        toolDrawerTargetRow.querySelector('.order-tool-display').value = t.code + ' — ' + t.name + ' (' + t.type + ')';
        toolDrawerTargetRow.querySelector('.order-tool-id').value = t.id;
        closeToolDrawer();
    }

    function addOrderRow() {
        const tbody = document.getElementById('orderItemsBody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>
                <input type="text" class="order-tool-display" readonly placeholder="Click to select a tool..." onclick="openToolDrawer(this)" style="cursor: pointer; background: white; min-width: 260px;">
                <input type="hidden" class="order-tool-id" name="tool_id[]">
            </td>
            <td><input type="number" name="quantity[]" min="1" style="width: 100px;"></td>
            <td><input type="number" step="0.01" name="rate[]" style="width: 120px;"></td>
            <td><button type="button" onclick="removeOrderRow(this)" style="background: #c1121f;">✕</button></td>
        `;
        tbody.appendChild(row);
    }

    function removeOrderRow(btn) {
        const tbody = document.getElementById('orderItemsBody');
        if (tbody.rows.length > 1) {
            btn.closest('tr').remove();
        }
    }
</script>

{% endblock %}
